<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>

    <style>
        body {
            background-color: lightgrey;
            font-family: 'Times New Roman', Times, serif;
        }
        .card {
            width: 300px;
            background-color: #B4C424;
            color: white;
            padding: 20px;
            margin: auto;
            margin-top: 50px;
            text-align: center;
            border-radius: 10px;
        }
        .photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid white;
        }
        #heading {
            color: gold;
        }
        .details {
            font-size: 16px;
        }
        .btn {
            background-color: white;
            color: darkgreen;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: gold;
            color: black;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="photo" src="studentprofileimg.jpg" alt="Student Photo">
        <h1 id="heading">Student Profile</h1>
        <p class="details">Name: Khushi Maharjan</p>
        <p class="details">Course: BScIT Fall 2024</p>
        <p class="details">Address: Kathmandu, Nepal</p>
        <p class="details">Email: khushhimaharjan@gmail.com</p>
        <p class="details">Interests: Graphic Design, AI/ML</p>
        <button class="btn">More</button>
    </div>
</body>    
</html>
