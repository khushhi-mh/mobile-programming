<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ATM Machine</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .atm-box {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
            text-align: center;
            width: 300px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        h3 {
            color: green;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:first-of-type {
            background-color: #28a745;
            color: white;
        }

        button:last-of-type {
            background-color: #dc3545;
            color: white;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>

</head>
<body>

<div class="atm-box">

    <h2>ATM MACHINE</h2>

    <h3 id="balanceText">Balance: Rs. 10000</h3>

    <input type="number" id="amount" placeholder="Enter amount">

    <br>

    <button onclick="deposit()">Deposit</button>
    <button onclick="withdraw()">Withdraw</button>

    <p id="message"></p>

</div>

<script src="atmfunction.js"></script>

</body>
</html>
