
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComplaintHub</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="phone">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="screen active">

    <div class="logo-container">

        <div class="logo-circle">
            🏠
        </div>

        <h1 class="app-title">
            ComplaintHub
        </h1>

    </div>

    <div class="login-form">

        <label>Username</label>

        <input
            id="username"
            type="text"
            placeholder="Enter username"
        >

        <label>Password</label>

        <div class="password-box">

            <input
                id="password"
                type="password"
                placeholder="Enter password"
            >

            <button
                type="button"
                class="eye-btn"
                onclick="togglePassword()"
            >
                👁
            </button>

        </div>

        <p class="forgot-password">
            Forgot Password?
        </p>

        <button
            class="login-btn"
            onclick="login()"
        >
            Login
        </button>

        <div class="divider">

            <span></span>

            <p>or continue with</p>

            <span></span>

        </div>

        <button class="social-btn">
            <img src="https://developers.google.com/static/identity/images/g-logo.png">
            Continue with Google
        </button>

        <button class="social-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png">
            Continue with LinkedIn
        </button>

        <p class="signup-text">
            Don't have an account? Sign Up
        </p>

    </div>

</div>

    <!-- DASHBOARD -->
    <section id="dashboardScreen" class="screen">

        <div class="header">
            <h2>ComplaintHub</h2>
            <p>Community Management</p>
        </div>

        <div class="welcome-card">
            <h3>Welcome Back!</h3>
            <p>Track and manage community complaints.</p>
        </div>

        <div class="overview-grid">

            <div class="overview-card">
                <h3 id="totalComplaints">0</h3>
                <p>Total Complaints</p>
            </div>

            <div class="overview-card">
                <h3 id="pendingComplaints">0</h3>
                <p>Pending</p>
            </div>

        </div>

        <div class="action-section">
            <button onclick="showScreen('reportScreen')">
                Report Complaint
            </button>
        </div>

        <div class="section-title">
            Recent Complaints
        </div>

        <div id="recentComplaints"></div>

        <div class="bottom-nav">

            <button class="nav-btn active-nav"
                onclick="showScreen('dashboardScreen')">
                Home
            </button>

            <button class="nav-btn"
                onclick="showScreen('complaintsScreen')">
                Complaints
            </button>

            <button class="nav-btn"
                onclick="showScreen('announcementsScreen')">
                Announcements
            </button>

        </div>

    </section>

    <!-- REPORT COMPLAINT -->
    <section id="reportScreen" class="screen">

        <div class="header">
            <h2>Report Complaint</h2>
        </div>

        <div class="form-container">

            <input
                type="text"
                id="complaintTitle"
                placeholder="Complaint Title"
            >

            <input
                type="text"
                id="complaintLocation"
                placeholder="Location"
            >

            <select id="complaintCategory">

                <option value="">
                    Select Category
                </option>

                <option>
                    Infrastructure
                </option>

                <option>
                    Sanitation
                </option>

                <option>
                    Water Supply
                </option>

                <option>
                    Electricity
                </option>

                <option>
                    Security
                </option>

            </select>

            <textarea
                id="complaintDescription"
                placeholder="Describe your complaint"
                rows="5">
            </textarea>

            <button onclick="submitComplaint()">
                Submit Complaint
            </button>

            <button class="secondary-btn"
                onclick="showScreen('dashboardScreen')">
                Cancel
            </button>

        </div>

    </section>

    <!-- MY COMPLAINTS -->
    <section id="complaintsScreen" class="screen">

        <div class="header">
            <h2>My Complaints</h2>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchComplaint"
                placeholder="Search complaints..."
                onkeyup="renderComplaints()"
            >
        </div>

        <div id="complaintsList"></div>

        <div class="bottom-nav">

            <button class="nav-btn"
                onclick="showScreen('dashboardScreen')">
                Home
            </button>

            <button class="nav-btn active-nav"
                onclick="showScreen('complaintsScreen')">
                Complaints
            </button>

            <button class="nav-btn"
                onclick="showScreen('announcementsScreen')">
                Announcements
            </button>

        </div>

    </section>

    <!-- COMPLAINT DETAIL -->
    <section id="detailScreen" class="screen">

        <div class="header">
            <h2>Complaint Details</h2>
        </div>

        <div id="detailContainer"></div>

        <button class="secondary-btn"
            onclick="showScreen('complaintsScreen')">
            Back
        </button>

    </section>

    <!-- ANNOUNCEMENTS -->
    <section id="announcementsScreen" class="screen">

        <div class="header">
            <h2>Announcements</h2>
        </div>

        <div class="search-box">

            <input
                type="text"
                id="announcementSearch"
                placeholder="Search announcements..."
                onkeyup="renderAnnouncements()"
            >

        </div>

        <div id="announcementList"></div>

        <div class="bottom-nav">

            <button class="nav-btn"
                onclick="showScreen('dashboardScreen')">
                Home
            </button>

            <button class="nav-btn"
                onclick="showScreen('complaintsScreen')">
                Complaints
            </button>

            <button class="nav-btn active-nav"
                onclick="showScreen('announcementsScreen')">
                Announcements
            </button>

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
